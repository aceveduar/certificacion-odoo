<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificación Funcional Odoo 19</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <div class="badge">📋 Examen Oficial</div>
    <h1>Certificación Funcional<br>Odoo 19</h1>
    <p class="subtitle">Banco de preguntas completo · Todas las secciones</p>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-num" id="totalCount">—</div>
      <div class="stat-label">Preguntas</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="sectionCount">—</div>
      <div class="stat-label">Secciones</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="answeredCount">0</div>
      <div class="stat-label">Respondidas</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="correctCount" style="color: var(--green)">0</div>
      <div class="stat-label">Correctas</div>
    </div>
  </div>

  <div class="progress-bar" id="progressBar" style="display:none">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="score-panel" id="scorePanel">
    <div class="score-big" id="scoreBig">0%</div>
    <div style="color: var(--muted); margin-top: 8px; font-size: 14px" id="scoreText"></div>
  </div>

  <div class="controls">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar pregunta...">
    </div>
    <select class="filter-select" id="sectionFilter">
      <option value="">Todas las secciones</option>
    </select>
    <div class="mode-toggle">
      <button class="mode-btn active" onclick="setMode('study')" id="btnStudy">📖 Estudio</button>
      <button class="mode-btn" onclick="setMode('practice')" id="btnPractice">🎯 Práctica</button>
    </div>
    <button class="results-btn" id="resultsBtn" onclick="toggleResults()">📊 Resultados</button>
    <button class="auditor-btn" id="auditorBtn" onclick="toggleAuditor()">🔑 Auditor</button>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Cambiar tema"></button>
  </div>

  <!-- Modal editar / crear pregunta -->
  <div class="modal-overlay" id="qModalOverlay">
    <div class="modal q-modal" onclick="event.stopPropagation()">
      <h3 id="qModalTitle">Editar pregunta</h3>

      <label class="form-label">Sección</label>
      <input list="sectionList" id="qSection" class="form-input" placeholder="Ej. Ventas">
      <datalist id="sectionList"></datalist>

      <label class="form-label">Pregunta</label>
      <textarea id="qQuestion" class="form-textarea" rows="3" placeholder="Escribe la pregunta..."></textarea>

      <label class="form-label">Opción A</label>
      <textarea id="qOptA" class="form-textarea" rows="2" placeholder="Opción A..."></textarea>

      <label class="form-label">Opción B</label>
      <textarea id="qOptB" class="form-textarea" rows="2" placeholder="Opción B..."></textarea>

      <label class="form-label">Opción C</label>
      <textarea id="qOptC" class="form-textarea" rows="2" placeholder="Opción C..."></textarea>

      <label class="form-label">Respuesta correcta</label>
      <div class="answer-radio">
        <label class="radio-opt"><input type="radio" name="qAnswer" value=""> Ninguna</label>
        <label class="radio-opt"><input type="radio" name="qAnswer" value="A"> A</label>
        <label class="radio-opt"><input type="radio" name="qAnswer" value="B"> B</label>
        <label class="radio-opt"><input type="radio" name="qAnswer" value="C"> C</label>
      </div>

      <label class="form-label">Mi respuesta en el examen</label>
      <div class="answer-radio">
        <label class="radio-opt"><input type="radio" name="qMyAnswer" value=""> Ninguna</label>
        <label class="radio-opt my-answer-opt"><input type="radio" name="qMyAnswer" value="A"> A</label>
        <label class="radio-opt my-answer-opt"><input type="radio" name="qMyAnswer" value="B"> B</label>
        <label class="radio-opt my-answer-opt"><input type="radio" name="qMyAnswer" value="C"> C</label>
      </div>

      <label class="form-label">Examen</label>
      <div class="answer-radio">
        <label class="radio-opt"><input type="radio" name="qPrueba" value=""> Sin asignar</label>
        <label class="radio-opt prueba-opt"><input type="radio" name="qPrueba" value="prueba1"> Prueba 1</label>
        <label class="radio-opt prueba-opt"><input type="radio" name="qPrueba" value="prueba2"> Prueba 2</label>
      </div>

      <div class="modal-actions" style="margin-top:20px">
        <button class="modal-btn delete" id="qDeleteBtn" onclick="deleteQuestion()">🗑 Eliminar</button>
        <button class="modal-btn cancel" onclick="closeQModal()">Cancelar</button>
        <button class="modal-btn confirm" onclick="saveQuestion()">Guardar</button>
      </div>
      <p class="modal-error" id="qModalError"></p>
    </div>
  </div>

  <!-- Modal auditor -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>Modo Auditor</h3>
      <p>Ingresa la contraseña para editar respuestas correctas.</p>
      <input type="password" id="auditorPass" placeholder="Contraseña" onkeydown="if(event.key==='Enter') checkPass()">
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeModal()">Cancelar</button>
        <button class="modal-btn confirm" onclick="checkPass()">Entrar</button>
      </div>
      <p class="modal-error" id="modalError"></p>
    </div>
  </div>

  <div class="quick-filters" id="quickFilters">
    <button class="qf-btn active" id="qfAll"      onclick="setFlagFilter(null)">Todas <span id="qfAllCount"></span></button>
    <button class="qf-btn segura"  id="qfSegura"  onclick="setFlagFilter('segura')">✅ Seguras <span id="qfSeguraCount">0</span></button>
    <button class="qf-btn revisar"   id="qfRevisar"   onclick="setFlagFilter('revisar')">🔍 A revisar <span id="qfRevisarCount">0</span></button>
    <button class="qf-btn ilegible" id="qfIlegible" onclick="setFlagFilter('ilegible')">⚠️ Ilegibles <span id="qfIlegibleCount">0</span></button>
  </div>

  <!-- Panel de resultados del examen -->
  <div class="results-panel" id="resultsPanel" style="display:none">
    <div class="results-tabs">
      <button class="results-tab active" id="rtab1" onclick="switchResultTab(1)">📊 Prueba 1</button>
      <button class="results-tab"        id="rtab2" onclick="switchResultTab(2)">📊 Prueba 2</button>
    </div>
    <div class="results-img-wrap" id="rimg1">
      <img src="prueba1.jpeg" alt="Resultados Prueba 1">
    </div>
    <div class="results-img-wrap" id="rimg2" style="display:none">
      <img src="prueba2.png" alt="Resultados Prueba 2">
    </div>
  </div>

  <div class="prueba-filters" id="pruebaFilters">
    <button class="pf-btn active" id="pfAll" onclick="setPruebaFilter(null)">📋 Todas</button>
    <button class="pf-btn" id="pfP1" onclick="setPruebaFilter('prueba1')">Prueba 1 <span id="pfP1Count">0</span></button>
    <button class="pf-btn" id="pfP2" onclick="setPruebaFilter('prueba2')">Prueba 2 <span id="pfP2Count">0</span></button>
    <button class="pf-btn sin" id="pfSin" onclick="setPruebaFilter('sin')">Sin asignar <span id="pfSinCount">0</span></button>
  </div>

  <div class="section-tabs" id="sectionTabs"></div>
  <div class="result-count" id="resultCount"></div>
  <div class="questions-list" id="questionsList"></div>
</div>

<button class="fab" id="fabNew" onclick="openQuestionModal()" title="Nueva pregunta">＋</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://zenxdjuknwwdfbmbdsjg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_rYyf2FSuhy9vaPV0k7eNoA_cxSlen2m';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const AUDITOR_PASS = 'odoo2025';

(function initTheme() {
  const saved = localStorage.getItem('odoo_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';
})();

function toggleResults() {
  const panel = document.getElementById('resultsPanel');
  const btn   = document.getElementById('resultsBtn');
  const open  = panel.style.display === 'none';
  panel.style.display = open ? 'block' : 'none';
  btn.classList.toggle('active', open);
}

function switchResultTab(n) {
  document.getElementById('rimg1').style.display = n === 1 ? 'block' : 'none';
  document.getElementById('rimg2').style.display = n === 2 ? 'block' : 'none';
  document.getElementById('rtab1').classList.toggle('active', n === 1);
  document.getElementById('rtab2').classList.toggle('active', n === 2);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('odoo_theme', next);
}

let questions = [];
let mode = 'study';
let activeSection = 'all';
let searchTerm = '';
let answered    = {};
let revealed    = {};
let expandedIds = new Set();
let dragSrcId   = null;
let auditorMode = false;
let flagFilter   = null;
let pruebaFilter = null;

function setPruebaFilter(val) {
  pruebaFilter = val;
  document.querySelectorAll('.pf-btn').forEach(b => b.classList.remove('active'));
  const map = { null: 'pfAll', prueba1: 'pfP1', prueba2: 'pfP2', sin: 'pfSin' };
  document.getElementById(map[val] ?? 'pfAll').classList.add('active');
  render();
}

async function setMyAnswer(questionId, key, e) {
  e.stopPropagation();
  const q = questions.find(q => q.id === questionId);
  if (!q) return;
  const newVal = q.my_answer === key ? null : key;
  const { error } = await db.from('preguntas').update({ my_answer: newVal }).eq('id', questionId);
  if (error) { console.error(error); return; }
  q.my_answer = newVal;
  render();
}

function editSection(qId, spanEl) {
  const q = questions.find(q => q.id === qId);
  if (!q) return;

  const input = document.createElement('input');
  input.type = 'text';
  input.value = q.section;
  input.className = 'section-inline-input';
  input.setAttribute('list', 'sectionList');

  spanEl.replaceWith(input);
  input.focus();
  input.select();

  async function save() {
    const newVal = input.value.trim();
    if (newVal && newVal !== q.section) {
      const { error } = await db.from('preguntas').update({ section: newVal }).eq('id', qId);
      if (!error) {
        q.section = newVal;
        const dl = document.getElementById('sectionList');
        if (![...dl.options].some(o => o.value === newVal)) {
          const opt = document.createElement('option'); opt.value = newVal;
          dl.appendChild(opt);
        }
      }
    }
    render();
  }

  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = q.section; input.blur(); }
  });
}

async function setPrueba(qId, prueba, e) {
  e.stopPropagation();
  const q = questions.find(q => q.id === qId);
  if (!q) return;
  const newVal = q.prueba === prueba ? null : prueba;
  const { error } = await db.from('preguntas').update({ prueba: newVal }).eq('id', qId);
  if (error) { console.error(error); return; }
  q.prueba = newVal;
  render();
}

async function setFlag(qId, status, e) {
  e.stopPropagation();
  const q = questions.find(q => q.id === qId);
  if (!q) return;
  const newStatus = q.status === status ? null : status;
  const { error } = await db.from('preguntas').update({ status: newStatus }).eq('id', qId);
  if (error) { console.error(error); return; }
  q.status = newStatus;
  render();
}

function setFlagFilter(val) {
  flagFilter = val;
  document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));
  const map = { null: 'qfAll', segura: 'qfSegura', revisar: 'qfRevisar', ilegible: 'qfIlegible' };
  document.getElementById(map[val] ?? 'qfAll').classList.add('active');
  render();
}

function setAuditorUI(active) {
  auditorMode = active;
  const btn = document.getElementById('auditorBtn');
  btn.classList.toggle('active', active);
  btn.textContent = active ? '🚪 Salir auditor' : '🔑 Auditor';
  document.getElementById('fabNew').classList.toggle('visible', active);
  localStorage.setItem('odoo_auditor', active ? '1' : '0');
}

function toggleAuditor() {
  if (auditorMode) {
    if (!confirm('¿Deseas salir del modo auditor?')) return;
    setAuditorUI(false);
    render();
    return;
  }
  document.getElementById('modalOverlay').classList.add('visible');
  setTimeout(() => document.getElementById('auditorPass').focus(), 100);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('visible');
  document.getElementById('auditorPass').value = '';
  document.getElementById('modalError').textContent = '';
}

function checkPass() {
  const val = document.getElementById('auditorPass').value;
  if (val === AUDITOR_PASS) {
    setAuditorUI(true);
    closeModal();
    if (mode !== 'study') setMode('study');
    else render();
    setFlagFilter('revisar');
  } else {
    document.getElementById('modalError').textContent = 'Contraseña incorrecta.';
  }
}

// ─── QUESTION EDITOR ──────────────────────────────────────────────────────────

let currentEditId = null;

function openQuestionModal(q = null) {
  currentEditId = q ? q.id : null;
  document.getElementById('qModalTitle').textContent = q ? 'Editar pregunta' : 'Nueva pregunta';
  document.getElementById('qSection').value   = q ? q.section         : '';
  document.getElementById('qQuestion').value  = q ? q.question        : '';
  document.getElementById('qOptA').value       = q ? q.options.A      : '';
  document.getElementById('qOptB').value       = q ? q.options.B      : '';
  document.getElementById('qOptC').value       = q ? q.options.C      : '';
  document.getElementById('qModalError').textContent = '';
  const ans = q ? q.answer : 'A';
  document.querySelector(`input[name="qAnswer"][value="${ans}"]`).checked = true;
  const myAns = q?.my_answer || '';
  document.querySelector(`input[name="qMyAnswer"][value="${myAns}"]`).checked = true;
  const prueba = q?.prueba || '';
  document.querySelector(`input[name="qPrueba"][value="${prueba}"]`).checked = true;
  document.getElementById('qDeleteBtn').style.display = q ? 'flex' : 'none';
  document.getElementById('qModalOverlay').classList.add('visible');
  setTimeout(() => document.getElementById('qSection').focus(), 100);
}

function closeQModal() {
  document.getElementById('qModalOverlay').classList.remove('visible');
}

async function saveQuestion() {
  const section  = document.getElementById('qSection').value.trim();
  const question = document.getElementById('qQuestion').value.trim();
  const optA     = document.getElementById('qOptA').value.trim();
  const optB     = document.getElementById('qOptB').value.trim();
  const optC     = document.getElementById('qOptC').value.trim();
  const answer   = document.querySelector('input[name="qAnswer"]:checked')?.value;
  const errEl    = document.getElementById('qModalError');

  if (!section || !question || !optA || !optB || !optC) {
    errEl.textContent = 'Completa sección, pregunta y las tres opciones.';
    return;
  }

  const myAnswer = document.querySelector('input[name="qMyAnswer"]:checked')?.value || null;
  const prueba   = document.querySelector('input[name="qPrueba"]:checked')?.value   || null;
  const payload  = { section, question, options: { A: optA, B: optB, C: optC }, answer, my_answer: myAnswer || null, prueba: prueba || null };

  if (currentEditId) {
    const { error } = await db.from('preguntas').update(payload).eq('id', currentEditId);
    if (error) { errEl.textContent = 'Error: ' + error.message; return; }
    const idx = questions.findIndex(q => q.id === currentEditId);
    if (idx !== -1) questions[idx] = { ...questions[idx], ...payload };
  } else {
    const { data, error } = await db.from('preguntas').insert(payload).select().single();
    if (error) { errEl.textContent = 'Error: ' + error.message; return; }
    questions.push(data);
    document.getElementById('totalCount').textContent = questions.length;
  }

  closeQModal();
  render();
}

async function deleteQuestion() {
  if (!currentEditId) return;
  if (!confirm('¿Eliminar esta pregunta? Esta acción no se puede deshacer.')) return;

  const { error } = await db.from('preguntas').delete().eq('id', currentEditId);
  if (error) { document.getElementById('qModalError').textContent = 'Error: ' + error.message; return; }

  questions = questions.filter(q => q.id !== currentEditId);
  document.getElementById('totalCount').textContent = questions.length;
  closeQModal();
  render();
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('visible'));
  setTimeout(() => { t.classList.remove('visible'); setTimeout(() => t.remove(), 400); }, 4000);
}

async function migrateLocalFlags() {
  const raw = localStorage.getItem('odoo_flags');
  if (!raw) return 0;

  let localFlags;
  try { localFlags = JSON.parse(raw); } catch { localStorage.removeItem('odoo_flags'); return 0; }

  const entries = Object.entries(localFlags).filter(([, v]) => v === 'segura' || v === 'revisar');
  if (!entries.length) { localStorage.removeItem('odoo_flags'); return 0; }

  const seguraIds  = entries.filter(([, v]) => v === 'segura').map(([k]) => parseInt(k));
  const revisarIds = entries.filter(([, v]) => v === 'revisar').map(([k]) => parseInt(k));

  const ops = [];
  if (seguraIds.length)  ops.push(db.from('preguntas').update({ status: 'segura'  }).in('id', seguraIds));
  if (revisarIds.length) ops.push(db.from('preguntas').update({ status: 'revisar' }).in('id', revisarIds));

  const results = await Promise.all(ops);
  const hasError = results.some(r => r.error);
  if (hasError) { console.error('Error migrando flags'); return 0; }

  // Actualizar el array local para que render() los muestre ya
  entries.forEach(([id, status]) => {
    const q = questions.find(q => q.id === parseInt(id));
    if (q) q.status = status;
  });

  localStorage.removeItem('odoo_flags');
  return entries.length;
}

async function setCorrectAnswer(questionId, newAnswer) {
  const q = questions.find(q => q.id === questionId);
  if (!q || q.answer === newAnswer) return;

  const { error } = await db
    .from('preguntas')
    .update({ answer: newAnswer })
    .eq('id', questionId);

  if (error) {
    alert('Error al guardar: ' + error.message);
    return;
  }

  q.answer = newAnswer;
  if (localStorage.getItem('odoo_auditor') === '1') {
    setAuditorUI(true);
  }

  render();
}

// ─── DRAG & DROP ──────────────────────────────────────────────────────────────

function onDragStart(e, qId) {
  dragSrcId = qId;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => e.target.closest('.q-card').classList.add('dragging'), 0);
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function onDragEnd() {
  document.querySelectorAll('.dragging, .drag-over').forEach(el =>
    el.classList.remove('dragging', 'drag-over'));
  dragSrcId = null;
}

async function onDrop(e, targetQId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragSrcId || dragSrcId === targetQId) return;

  const srcIdx    = questions.findIndex(q => q.id === dragSrcId);
  const targetIdx = questions.findIndex(q => q.id === targetQId);
  if (srcIdx === -1 || targetIdx === -1) return;

  const [moved] = questions.splice(srcIdx, 1);
  questions.splice(targetIdx, 0, moved);

  // Reasignar sort_order y guardar solo los que cambiaron
  const updates = [];
  questions.forEach((q, i) => {
    const newOrder = i + 1;
    if (q.sort_order !== newOrder) {
      q.sort_order = newOrder;
      updates.push(db.from('preguntas').update({ sort_order: newOrder }).eq('id', q.id));
    }
  });

  render();
  await Promise.all(updates);
}

async function init() {
  questionsList.innerHTML = '<div class="empty"><div class="emoji">⏳</div><p>Cargando preguntas...</p></div>';

  const { data, error } = await db
    .from('preguntas')
    .select('*')
    .order('sort_order', { nullsFirst: false });

  if (error) {
    questionsList.innerHTML = `<div class="empty"><div class="emoji">❌</div><p>Error al cargar: ${error.message}</p></div>`;
    return;
  }

  questions = data;

  const migrated = await migrateLocalFlags();
  if (migrated > 0) showToast(`✅ ${migrated} marcas sincronizadas con la base de datos.`);

  const sections = [...new Set(questions.map(q => q.section))];
  document.getElementById('totalCount').textContent = questions.length;
  document.getElementById('sectionCount').textContent = sections.length;

  const sel = document.getElementById('sectionFilter');
  sections.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });

  const tabs = document.getElementById('sectionTabs');
  const allTab = document.createElement('button');
  allTab.className = 'tab active'; allTab.textContent = 'Todas';
  allTab.onclick = () => filterBySection('all', allTab);
  tabs.appendChild(allTab);

  sections.forEach(s => {
    const t = document.createElement('button');
    t.className = 'tab'; t.textContent = s;
    t.onclick = () => filterBySection(s, t);
    tabs.appendChild(t);
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value.toLowerCase();
    render();
  });
  document.getElementById('sectionFilter').addEventListener('change', e => {
    activeSection = e.target.value || 'all';
    updateTabs();
    render();
  });

  const dl = document.getElementById('sectionList');
  sections.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    dl.appendChild(opt);
  });

  render();
}

function filterBySection(sec, tab) {
  activeSection = sec;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('sectionFilter').value = sec === 'all' ? '' : sec;
  render();
}

function updateTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    const isAll = t.textContent === 'Todas' && activeSection === 'all';
    t.classList.toggle('active', isAll || t.textContent === activeSection);
  });
}

function setMode(m) {
  mode = m;
  document.getElementById('btnStudy').classList.toggle('active', m === 'study');
  document.getElementById('btnPractice').classList.toggle('active', m === 'practice');

  if (m === 'practice') {
    answered = {}; revealed = {};
    document.getElementById('progressBar').style.display = 'block';
    document.getElementById('scorePanel').classList.remove('visible');
    updateScore();
  } else {
    document.getElementById('progressBar').style.display = 'none';
    document.getElementById('scorePanel').classList.remove('visible');
  }

  document.querySelectorAll('.q-card').forEach(c => c.classList.remove('expanded'));
  render();
}

function updateScore() {
  const total = questions.length;
  const ans = Object.keys(answered).length;
  const corr = Object.values(answered).filter(v => v).length;
  document.getElementById('answeredCount').textContent = ans;
  document.getElementById('correctCount').textContent = corr;

  if (mode === 'practice') {
    const pct = total ? Math.round(ans / total * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';

    if (ans === total) {
      const score = Math.round(corr / total * 100);
      const panel = document.getElementById('scorePanel');
      const big = document.getElementById('scoreBig');
      panel.classList.add('visible');
      big.textContent = score + '%';
      big.className = 'score-big ' + (score >= 70 ? 'good' : score >= 50 ? 'ok' : 'bad');
      document.getElementById('scoreText').textContent = `${corr} correctas de ${total} preguntas`;
    }
  }
}

function getFiltered() {
  return questions.filter(q => {
    const secOk = activeSection === 'all' || q.section === activeSection;
    const searchOk = !searchTerm ||
      q.question.toLowerCase().includes(searchTerm) ||
      Object.values(q.options).some(o => o.toLowerCase().includes(searchTerm));
    const flagOk   = !flagFilter || q.status === flagFilter;
    const pruebaOk = !pruebaFilter
      ? true
      : pruebaFilter === 'sin'
        ? !q.prueba
        : q.prueba === pruebaFilter;
    return secOk && searchOk && flagOk && pruebaOk;
  });
}

function render() {
  const filtered = getFiltered();
  const list = document.getElementById('questionsList');
  document.getElementById('resultCount').innerHTML =
    `Mostrando <span>${filtered.length}</span> de <span>${questions.length}</span> preguntas`;

  const nSegura  = questions.filter(q => q.status === 'segura').length;
  const nRevisar = questions.filter(q => q.status === 'revisar').length;
  document.getElementById('qfAllCount').textContent     = questions.length ? `(${questions.length})` : '';
  document.getElementById('qfSeguraCount').textContent   = nSegura;
  document.getElementById('qfRevisarCount').textContent  = nRevisar;
  document.getElementById('qfIlegibleCount').textContent = questions.filter(q => q.status === 'ilegible').length;

  document.getElementById('pfP1Count').textContent  = questions.filter(q => q.prueba === 'prueba1').length;
  document.getElementById('pfP2Count').textContent  = questions.filter(q => q.prueba === 'prueba2').length;
  document.getElementById('pfSinCount').textContent = questions.filter(q => !q.prueba).length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><div class="emoji">🔍</div><p>No se encontraron preguntas.</p></div>';
    return;
  }

  list.innerHTML = '';
  filtered.forEach((q, fi) => {
    const globalIdx = questions.indexOf(q);
    const qFlag = q.status || null;
    const card = document.createElement('div');
    card.className = 'q-card'
      + (mode === 'practice' ? ' practice-mode' : '')
      + (qFlag ? ` flag-${qFlag}` : '');
    card.dataset.qid = q.id;

    const optKeys = Object.keys(q.options);
    let optHtml = '';
    optKeys.forEach(key => {
      const isCorrect = key === q.answer;
      const wasAnswered = answered[globalIdx] !== undefined;
      const wasSelected = revealed[globalIdx] === key;

      const isMyAnswer = mode === 'study' && q.my_answer === key && !isCorrect;

      let cls = 'option';
      if (mode === 'study' && isCorrect)   cls += ' correct';
      if (mode === 'study' && isMyAnswer)  cls += ' my-answer';
      if (auditorMode && mode === 'study') cls += ' auditor-option';
      if (mode === 'practice' && wasAnswered) {
        if (wasSelected && isCorrect)       cls += ' selected-correct';
        else if (wasSelected && !isCorrect) cls += ' selected-wrong';
        else if (isCorrect)                 cls += ' correct';
      }

      let rightHtml = '';
      const pruebaLabel = q.prueba ? `<span class="prueba-badge ${q.prueba}">${q.prueba === 'prueba1' ? 'P1' : 'P2'}</span>` : '';

      if (auditorMode && mode === 'study') {
        rightHtml = `<div class="opt-actions">
          ${isCorrect
            ? `<span class="correct-badge">✓ Correcta</span>`
            : `<button class="set-correct-btn" onclick="event.stopPropagation(); setCorrectAnswer(${q.id}, '${key}')">✓ Correcta</button>`}
          <button class="set-my-btn ${q.my_answer === key ? 'active' : ''}" onclick="event.stopPropagation(); setMyAnswer(${q.id}, '${key}', event)">📌 Mi resp.</button>
        </div>`;
      } else if (mode === 'study') {
        const badges = [];
        if (isCorrect) {
          badges.push('<span class="correct-badge">✓ Correcta</span>');
        }
        if (isMyAnswer) {
          badges.push('<span class="my-answer-badge">📌 Mi resp.</span>');
        }
        if (badges.length) rightHtml = `<div class="opt-actions">${badges.join('')}</div>`;
      }

      optHtml += `
        <div class="${cls}" onclick="selectOption(${globalIdx}, '${key}', this)">
          <div class="opt-letter">${key}</div>
          <div class="opt-text">${q.options[key]}</div>
          ${rightHtml}
        </div>`;
    });

    card.setAttribute('ondragover',  'onDragOver(event)');
    card.setAttribute('ondragleave', 'onDragLeave(event)');
    card.setAttribute('ondrop',      `onDrop(event, ${q.id})`);
    card.setAttribute('ondragend',   'onDragEnd()');

    card.innerHTML = `
      <div class="q-header" onclick="toggleCard(this.parentElement)">
        <div class="drag-handle" draggable="true" ondragstart="onDragStart(event, ${q.id})" onclick="event.stopPropagation()" title="Arrastrar para reordenar">⠿</div>
        <div class="q-num">${fi + 1}</div>
        <div class="q-meta">
          <div class="q-section">
            ${auditorMode
              ? `<span class="section-label editable" title="Clic para editar sección" onclick="event.stopPropagation(); editSection(${q.id}, this)">${q.section}</span>`
              : q.section}
            ${q.prueba ? `<span class="prueba-tag ${q.prueba}">${q.prueba === 'prueba1' ? 'Prueba 1' : 'Prueba 2'}</span>` : ''}
          </div>
          <div class="q-text">${q.question}</div>
        </div>
        <div class="flag-btns">
          <button class="flag-btn ${qFlag === 'segura' ? 'active' : ''}" title="Segura" onclick="setFlag(${q.id}, 'segura', event)">✅</button>
          <button class="flag-btn ${qFlag === 'revisar' ? 'active' : ''}" title="A revisar" onclick="setFlag(${q.id}, 'revisar', event)">🔍</button>
          ${auditorMode ? `<button class="flag-btn ilegible-btn ${qFlag === 'ilegible' ? 'active' : ''}" title="Ilegible" onclick="setFlag(${q.id}, 'ilegible', event)">⚠️</button>` : ''}
          ${auditorMode ? `
            <button class="flag-btn prueba-btn ${q.prueba === 'prueba1' ? 'active p1' : ''}" title="Prueba 1" onclick="event.stopPropagation(); setPrueba(${q.id}, 'prueba1', event)">P1</button>
            <button class="flag-btn prueba-btn ${q.prueba === 'prueba2' ? 'active p2' : ''}" title="Prueba 2" onclick="event.stopPropagation(); setPrueba(${q.id}, 'prueba2', event)">P2</button>
            <button class="flag-btn edit-btn" title="Editar pregunta" onclick="event.stopPropagation(); openQuestionModal(questions[${globalIdx}])">✏️</button>
          ` : ''}
        </div>
        <div class="q-toggle">+</div>
      </div>
      <div class="q-body">
        <div class="options-list">${optHtml}</div>
      </div>`;

    if (expandedIds.has(q.id)) card.classList.add('expanded');
    list.appendChild(card);
  });
}

function toggleCard(card) {
  const wasExpanded = card.classList.contains('expanded');
  document.querySelectorAll('.q-card.expanded').forEach(c => {
    expandedIds.delete(+c.dataset.qid);
    c.classList.remove('expanded');
  });
  if (!wasExpanded) {
    card.classList.add('expanded');
    expandedIds.add(+card.dataset.qid);
  }
}

function selectOption(idx, key, el) {
  if (mode !== 'practice') return;
  if (answered[idx] !== undefined) return;

  const q = questions[idx];
  const isCorrect = key === q.answer;
  answered[idx] = isCorrect;
  revealed[idx] = key;

  const card = el.closest('.q-card');
  const optEls = card.querySelectorAll('.option');
  const optKeys = Object.keys(q.options);

  optEls.forEach((opt, i) => {
    const optKey = optKeys[i];
    opt.classList.remove('selected-correct', 'selected-wrong', 'correct');
    if (optKey === key && isCorrect) opt.classList.add('selected-correct');
    else if (optKey === key && !isCorrect) opt.classList.add('selected-wrong');
    else if (optKey === q.answer) opt.classList.add('correct');
  });

  updateScore();
}

init();
</script>
</body>
</html>
